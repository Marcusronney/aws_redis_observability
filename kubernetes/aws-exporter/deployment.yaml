
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter-aws
  namespace: redis-observability
  labels:
    app: redis-exporter-aws
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter-aws
  template:
    metadata:
      labels:
        app: redis-exporter-aws
    spec:
      containers:
        - name: redis-exporter
          image: ghcr.io/oliver006/redis_exporter:v1.93.0
          imagePullPolicy: IfNotPresent
          args:
            - "--redis.addr="
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-aws-auth
                  key: password
            - name: REDIS_EXPORTER_SKIP_TLS_VERIFICATION
              value: "false"
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-aws
  namespace: redis-observability
  labels:
    app: redis-exporter-aws
spec:
  type: ClusterIP
  selector:
    app: redis-exporter-aws
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
