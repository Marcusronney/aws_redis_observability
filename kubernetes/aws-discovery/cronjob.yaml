apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-discovery-aws
  namespace: redis-observability
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-discovery-aws-config
  namespace: redis-observability
data:
  config: '[profile redis-discovery-rolesanywhere]

    region = us-east-1

    credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate
    /etc/rolesanywhere/discovery.crt --private-key /etc/rolesanywhere/discovery.key
    --trust-anchor-arn arn:aws:rolesanywhere:us-east-1:762012032320:trust-anchor/42371124-90c5-4c53-a0cd-c5b7ae2da087
    --profile-arn arn:aws:rolesanywhere:us-east-1:762012032320:profile/b24aa831-cbe6-4cfc-bd14-9a12f9f75f2d
    --role-arn arn:aws:iam::762012032320:role/RedisObservabilityDiscoveryRole --region
    us-east-1

    '
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-discovery-aws
  namespace: redis-observability
  labels:
    app.kubernetes.io/part-of: redis-observability
spec:
  schedule: '*/5 * * * *'
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: redis-discovery-aws
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
          containers:
          - name: aws-discovery
            image: redis-discovery-aws:local-v5
            imagePullPolicy: IfNotPresent
            command:
            - sh
            - -ec
            args:
            - "set -eu\n echo \"Iniciando Discovery AWS...\"\n python -m discovery.aws_discovery\
              \ > /tmp/inventory.json\n python -m discovery.aws_discovery.targets\
              \ --input /tmp/inventory.json > /tmp/targets.json\n echo \"Planejamento\
              \ ECS distribuido...\"\n python -m discovery.aws_discovery.ecs_controller\
              \ --inventory /tmp/inventory.json --output /tmp/ecs-plan.json --apply\
              \ --confirm-account 762012032320 --max-changes 1\n echo \"Filtrando\
              \ somente targets locais...\"\n python -m discovery.aws_discovery.filter_local_targets\
              \ --input /tmp/targets.json --output /tmp/local-targets.json\n python\
              \ -m discovery.aws_discovery.scrapeconfig --input /tmp/local-targets.json\
              \ --output /tmp/scrapeconfig.yaml\n echo \"Reconciliando ScrapeConfigs\
              \ locais...\"\n python -m discovery.aws_discovery.reconciler --input\
              \ /tmp/local-targets.json --apply\n echo \"Ciclo concluido.\"\n"
            env:
            - name: REDIS_AWS_PROFILE
              value: redis-discovery-rolesanywhere
            - name: AWS_CONFIG_FILE
              value: /etc/aws/config
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: aws-config
              mountPath: /etc/aws
              readOnly: true
            - name: certificate
              mountPath: /etc/rolesanywhere
              readOnly: true
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: aws-config
            configMap:
              name: redis-discovery-aws-config
          - name: certificate
            secret:
              secretName: redis-discovery-aws-cert
              defaultMode: 288
          - name: tmp
            emptyDir: {}
