
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-discovery-aws-scrapeconfig-writer
  namespace: redis-observability
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - scrapeconfigs
    verbs:
      - get
      - list
      - create
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-discovery-aws-scrapeconfig-writer
  namespace: redis-observability
subjects:
  - kind: ServiceAccount
    name: redis-discovery-aws
    namespace: redis-observability
roleRef:
  kind: Role
  name: redis-discovery-aws-scrapeconfig-writer
  apiGroup: rbac.authorization.k8s.io
