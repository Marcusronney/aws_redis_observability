apiVersion: v1
kind: Pod
metadata:
  name: redis-client-vpn-check
  namespace: redis-observability
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: check
      image: redis:7.4-alpine
      command: [sh, -ec]
      args:
        - |
          for endpoint in \
            redis-observability-sa-test-ob1yxa.serverless.sae1.cache.amazonaws.com \
            redis-observability-v5-e2e-ob1yxa.serverless.sae1.cache.amazonaws.com; do
            nslookup "$endpoint"
            test "$(redis-cli --tls -h "$endpoint" -p 6379 PING)" = PONG
            echo "$endpoint PONG (TLS)"
          done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
