apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: redis-observability
resources:
  - cronjob.yaml
configMapGenerator:
  - name: redis-distributed-controller-config
    files:
      - controller-config.yaml
# Keeps the configmap name static. Updates must be followed by Job recreation.
generatorOptions:
  disableNameSuffixHash: true
